server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always

# Override with env vars for local dev:
#   export AUTH_SERVICE_URL=http://localhost:8081
#   export DATA_SERVICE_URL=http://localhost:8082
services:
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  data-service-url: ${DATA_SERVICE_URL:http://data-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS
