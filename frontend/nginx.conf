server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → api-gateway (auth, admin, SSRF, challenges)
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /data/* → data-service directly (intentional gateway bypass — attack surface)
    location /data/ {
        proxy_pass http://data-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
