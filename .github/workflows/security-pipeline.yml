name: Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # ☕ JAVA BUILD
      # -------------------------
      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Build project
        run: mvn clean install -DskipTests

      # -------------------------
      # 🐳 START SERVICES
      # -------------------------
      - name: 🐳 Start Docker Compose
        run: |
          docker compose up -d
          sleep 30

      # -------------------------
      # 🔍 SAST (Semgrep)
      # -------------------------
      - name: 🔍 Run Semgrep
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            returntocorp/semgrep \
            semgrep \
            --config=auto \
            --sarif \
            --output=/src/semgrep.sarif

      # -------------------------
      # 🔑 GITLEAKS
      # -------------------------
      - name: 🔐 Run Gitleaks (full control)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /repo \
            --report-format sarif \
            --report-path /repo/gitleaks-report.sarif \
            --log-opts="--all"
        continue-on-error: true

      # -------------------------
      # 🔑 TruffleHog
      # -------------------------
      - name: 🔐 Run TruffleHog
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --json > trufflehog-report.json
            
      # -------------------------
      # 🐳 TRIVY (container scan)
      # -------------------------
      - name: 🏗️ Build data-service image
        run: |
          docker build -t data-service:latest -f data-service/Dockerfile .
      - name: 🔍 Check Docker images
        run: docker images
      - name: 🐳 Scan Docker images with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image data-service:latest > trivy-report.txt
        continue-on-error: true

      # -------------------------
      # 🌐 NMAP
      # -------------------------
      - name: 🌐 Install Nmap
        run: sudo apt-get install -y nmap

      - name: 🌐 Run Nmap scan
        run: |
          nmap -sV -p- localhost > nmap-report.txt
        continue-on-error: true

      # -------------------------
      # 🧪 ZAP (DAST)
      # -------------------------
      - name: 🧪 Run OWASP ZAP scan
        run: |
          NETWORK=$(docker network ls --format '{{.Name}}' | grep _default | head -n 1)
      
          docker run \
            --user root \
            --network=$NETWORK \
            -v ${{ github.workspace }}:/zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://api-gateway:8080/api \
            -r zap-report.html
        continue-on-error: true
 
      # -------------------------
      # 📤 Upload Reports
      # -------------------------
      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.sarif
            semgrep.sarif
            nmap-report.txt
            zap-report.html
            trivy-report.txt
            trufflehog-report.json
