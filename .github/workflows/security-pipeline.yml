name: Security Pipeline

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # ☕ JAVA BUILD
      # -------------------------
      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Build project
        run: mvn clean install -DskipTests

      # -------------------------
      # 🐳 START SERVICES
      # -------------------------
      - name: 🐳 Start Docker Compose
        run: |
          docker compose up -d
          sleep 30

      # -------------------------
      # 🔍 SAST (Semgrep)
      # -------------------------
      - name: 🔍 Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"
        continue-on-error: true

      # -------------------------
      # 🔑 GITLEAKS
      # -------------------------
      - name: 🔑 Run Gitleaks
        run: |
          docker run --rm -v ${{ github.workspace }}:/repo \
          zricethezav/gitleaks detect \
          --source=/repo \
          --report-path=/repo/gitleaks-report.json
        continue-on-error: true

      # -------------------------
      # 📦 DEPENDENCY CHECK
      # -------------------------
      # - name: 📦 OWASP Dependency Check
      #   run: mvn org.owasp:dependency-check-maven:check
      #   continue-on-error: true

      # -------------------------
      # 🐳 TRIVY (container scan)
      # -------------------------
      - name: 🐳 Scan Docker images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-gateway'
          format: 'table'
          output: 'trivy-report.txt'
        continue-on-error: true

      # -------------------------
      # 🌐 NMAP
      # -------------------------
      - name: 🌐 Install Nmap
        run: sudo apt-get install -y nmap

      - name: 🌐 Run Nmap scan
        run: |
          nmap -sV -p- localhost > nmap-report.txt
        continue-on-error: true

      # -------------------------
      # 🧪 ZAP (DAST)
      # -------------------------
      - name: 🧪 Run OWASP ZAP scan
        run: |
          NETWORK=$(docker network ls --format '{{.Name}}' | grep _default | head -n 1)
      
          docker run \
            --user root \
            --network=$NETWORK \
            -v ${{ github.workspace }}:/zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://api-gateway:8080 \
            -r zap-report.html
        continue-on-error: true

      # -------------------------
      # 📤 Upload Reports
      # -------------------------
      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            nmap-report.txt
            zap-report.html
            trivy-report.txt
            target/dependency-check-report.html
